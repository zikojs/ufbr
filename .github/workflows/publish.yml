name: Publish Zikojs packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: true
        default: latest
        type: choice
        options: [latest, next, beta]
  push:
    tags:
      - "ufbr-v*"

permissions:
  contents: read

concurrency:
  group: publish-ufbr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: zikojs/pnpm-publish@v1.4
        with:
          tag-prefix: ufbr-v
          # dist-tag: ${{ inputs.tag }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          sync-templates: true
          template-patterns: "packages/create-ufbr/templates/*"
          fail-on-build-error: false
